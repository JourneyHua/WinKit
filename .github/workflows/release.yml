name: build-and-release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & build
        run: dotnet build WinKit.slnx -c Release --nologo

      - name: Publish (framework-dependent)
        run: dotnet publish src/WinKit/WinKit.csproj -c Release -o publish/framework-dependent --nologo

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/framework-dependent/* -DestinationPath WinKit-${{ github.ref_name }}-framework-dependent.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinKit-${{ github.ref_name }}
          path: |
            WinKit-${{ github.ref_name }}-framework-dependent.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ### 运行要求与使用说明

            - **WinKit 免 Runtime 轻量包**（`framework-dependent`，约 350 KB）：需系统安装 [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0)
            - 双击 `WinKit.exe`，接受 UAC 提权即可使用。
            - 包含：**系统概览**、**右键菜单管理**、**此电脑管理**、**导航栏管理**、**应用管理（卸载/残留清理/winget+scoop 更新）**、**驱动管理（自动备份/卸载/官方与本地更新）**、**启动与服务**、**系统清理**、**系统调优与百宝箱**、**文件占用解锁**、**文件与文件夹对比**、**重复文件检测**、**默认打开方式**、**事件日志诊断**、**Windows 更新管理**、**网络诊断**、**注册表体检**与**快照备份还原**。
          files: |
            WinKit-${{ github.ref_name }}-framework-dependent.zip
