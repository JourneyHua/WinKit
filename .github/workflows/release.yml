name: build-and-release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      release_version: ${{ steps.release_version.outputs.version }}
    env:
      PACKAGE_REF: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release version
        id: release_version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath src/WinKit/WinKit.csproj -Raw
          $version = $project.SelectSingleNode("/Project/PropertyGroup/Version").InnerText
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw "Invalid release version: $version" }
          if ($env:GITHUB_REF.StartsWith("refs/tags/") -and $env:GITHUB_REF_NAME -cne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match project version v$version"
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          "RELEASE_EXE=WinKit-v$version-win-x64.exe" >> $env:GITHUB_ENV
          "RELEASE_METADATA=WinKit-v$version-win-x64.update.json" >> $env:GITHUB_ENV

      - name: Restore & build
        run: dotnet build WinKit.slnx -c Release --nologo -m:1

      # ---- 质量门槛 1：服务层自测（快照/撤销/还原保真、解析器、分类器、报告导出）----
      - name: Self test
        shell: pwsh
        run: |
          dotnet run --project tools/Probe/Probe.csproj -c Release --no-build -- --selftest
          if ($LASTEXITCODE -ne 0) { throw "Selftest failed with exit code $LASTEXITCODE" }

      # ---- 质量门槛 2：界面离屏渲染 + 每个模块的数据断言 ----
      # 主清单本身就是 asInvoker（见 src/WinKit/app.manifest 的注释），
      # 所以界面自检和发布用的是同一份权限模型，不再需要为 smoke 单独换清单。
      - name: Publish single EXE for smoke and release (asInvoker)
        shell: pwsh
        run: |
          dotnet publish src/WinKit/WinKit.csproj -c Release -m:1 `
            -t:Rebuild -r win-x64 --self-contained true `
            -p:Version=$env:RELEASE_VERSION -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=embedded `
            -p:PublishTrimmed=false -p:PublishAot=false `
            -o publish/preview --nologo
          if ($LASTEXITCODE -ne 0) { throw "Publish for smoke failed" }

          $publishedFiles = @(Get-ChildItem -LiteralPath publish/preview -Recurse -File)
          if ($publishedFiles.Count -ne 1 -or $publishedFiles[0].Name -cne "WinKit.exe") {
            throw "Publish output must contain only WinKit.exe"
          }
          $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($publishedFiles[0].FullName)
          if ($versionInfo.ProductVersion -cne $env:RELEASE_VERSION -or $versionInfo.FileVersion -cne "$env:RELEASE_VERSION.0") {
            throw "Published EXE version does not match $env:RELEASE_VERSION"
          }

          # 清单必须嵌入 asInvoker，确保浏览不主动请求 UAC；此检查不保证 SmartScreen 行为。
          # 直接检查 apphost 字节中的属性形态，避免把注释里的裸词误认为执行级别。
          $exePath = Join-Path $PWD "publish/preview/WinKit.exe"
          $exeText = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes($exePath))
          if ($exeText -notmatch 'level="asInvoker"') { throw "清单没有嵌入 asInvoker，启动权限模型不符合预期" }
          if ($exeText -match 'level="requireAdministrator"') { throw "exe 的清单仍然要求提权" }

      - name: Update protocol self test
        timeout-minutes: 5
        shell: pwsh
        run: |
          dotnet run --project tools/UpdateProbe/UpdateProbe.csproj -c Release -- --fixture "$PWD/publish/preview/WinKit.exe" --framework-dependent-fixture "$PWD/src/WinKit/bin/Release/net10.0-windows/WinKit.exe"
          if ($LASTEXITCODE -ne 0) { throw "Update protocol selftest failed with exit code $LASTEXITCODE" }

      - name: Update installer transaction self test
        timeout-minutes: 5
        shell: pwsh
        run: |
          dotnet run --project tools/UpdateInstallerProbe/UpdateInstallerProbe.csproj -c Release -- --fixture "$PWD/publish/preview/WinKit.exe"
          if ($LASTEXITCODE -ne 0) { throw "Update installer selftest failed with exit code $LASTEXITCODE" }

      - name: Build public-update acceptance probe
        shell: pwsh
        run: |
          dotnet build tools/UpdateEndToEndProbe/UpdateEndToEndProbe.csproj -c Release --nologo -m:1
          if ($LASTEXITCODE -ne 0) { throw "Public-update probe build failed" }

      - name: Validate public-update observer environment
        timeout-minutes: 2
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/tools/UpdateEndToEndProbe/Run-UpdateEndToEnd.ps1", [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $root = [System.Windows.Automation.AutomationElement]::RootElement
          if ($null -eq $root) { throw "Windows UI Automation desktop root is unavailable" }
          Write-Host "Observer PowerShell parser and Windows UI Automation environment are ready."

      - name: UI smoke with assertions
        timeout-minutes: 10
        shell: pwsh
        run: |
          $out = Join-Path $PWD "smoke-out"
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue

          $exe = Join-Path $PWD "publish/preview/WinKit.exe"
          if (-not (Test-Path $exe)) { throw "找不到预览版 exe：$exe" }

          Write-Host "运行 $exe --smoke $out"
          $proc = Start-Process -FilePath $exe -ArgumentList '--smoke', "`"$out`"" -PassThru -Wait `
            -RedirectStandardOutput "$PWD/smoke.stdout.txt" -RedirectStandardError "$PWD/smoke.stderr.txt"
          Write-Host "退出码：$($proc.ExitCode)"

          foreach ($f in @("$PWD/smoke.stdout.txt", "$PWD/smoke.stderr.txt")) {
            if ((Test-Path $f) -and (Get-Item $f).Length -gt 0) {
              Write-Host "---- $(Split-Path $f -Leaf) ----"
              Get-Content $f | Write-Host
            }
          }

          $logPath = Join-Path $out "smoke.log"
          if (-not (Test-Path $logPath)) {
            Write-Host "输出目录内容："
            if (Test-Path $out) { Get-ChildItem $out | Write-Host } else { Write-Host "(目录不存在)" }
            throw "smoke.log 没有生成"
          }

          $log = Get-Content $logPath -Raw
          $failures = @()
          if ($proc.ExitCode -ne 0) { $failures += "界面自检退出码：$($proc.ExitCode)" }

          if ($log -notmatch 'SMOKE OK') { $failures += "日志里没有 SMOKE OK" }

          # 每个模块都必须有 OK 行（导航栏共 24 个模块）
          $okCount = ([regex]::Matches($log, '(?m)^MODULE OK (\S+) ->') |
            ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique | Measure-Object).Count
          if ($okCount -lt 24) { $failures += "只有 $okCount 个模块渲染成功，期望至少 24 个" }

          # 关键模块必须真的读到数据，而不只是"渲染出来了"。
          # 阈值取「任何正常机器都必然满足」的下限：CI runner 只有 1~2 个网卡、3 条 PATH，
          # 环境与本地开发机差别很大，卡太死会变成假失败。
          function Assert-Data($pattern, $name, $min) {
            $m = [regex]::Match($log, $pattern)
            if (-not $m.Success) { $script:failures += "$name 缺失数据行"; return }
            if ($min -gt 0) {
              $value = [int]$m.Groups[1].Value
              if ($value -lt $min) { $script:failures += "$name 数据量为 $value，期望 >= $min" }
            }
          }

          Assert-Data 'overview: cards=(\d+)' '系统概览' 4
          Assert-Data 'assoc: items=(\d+)' '默认打开方式' 50
          Assert-Data 'diff: entries=(\d+)' '文件对比' 1
          Assert-Data 'env: vars=(\d+)' '环境变量' 10
          Assert-Data 'report: sections=(\d+)' '体检报告' 5
          Assert-Data 'diskhealth: disks=(\d+)' '磁盘健康' 1
          Assert-Data 'network: adapters=(\d+)' '网络诊断' 1
          Assert-Data 'events: groups=(\d+)' '事件日志' 0
          Assert-Data 'wupdate: installed=(\d+)' 'Windows 更新' 0
          Assert-Data 'filelock: lockers=(\d+)' '文件占用' 0
          Assert-Data 'duplicates: groups=(\d+)' '重复文件' 0

          # 任务栏与通知区域：CI runner 是全新环境，固定项与托盘记录都可能为 0，
          # 所以只断言这两段跑出了数据行，不卡数量下限（卡下限只会变成假失败）。
          if ($log -notmatch 'taskbar: pinned=\d+ tray=\d+') { $failures += "任务栏管理 缺失数据行" }

          # 卸载残留清理的夹具是 smoke 自己造的（目录 + 空 uninstall.exe），
          # 所以「识别出 ≥1 个候选卸载器」在任何机器上都必然成立。
          Assert-Data 'uninstall: .*candidates=(\d+)' '卸载残留清理' 1

          # 列宽必须能拖：DataGridColumnHeader 模板里少了 PART_*HeaderGripper 就完全拖不动，
          # 而这一点截图看不出来，只能查模板部件。
          if ($log -notmatch 'columnresize: left=True right=True canResize=True result=OK') {
            $failures += "表格列宽无法拖动（模板缺少 PART_*HeaderGripper）"
          }

          # 子视图必须真的会隐藏：v1.8.0 的 bug 就是 Visibility 绑定写在同一元素的
          # DataContext 之后，绑定失败 → 面板一直显示，叠在应用列表上面。
          if ($log -notmatch 'uninstall-hidden: found=True .*visible=False') {
            $failures += "卸载残留清理面板在未激活时仍然可见"
          }
          if ($log -notmatch 'uninstall-view-off: found=True .*visible=False') {
            $failures += "卸载残留清理面板切走后没有隐藏"
          }
          if ($log -notmatch 'taskbar-view: found=True') {
            $failures += "任务栏页没有渲染出来"
          }

          # 列宽必须在视口内铺满：总宽一旦超过视口，卡内就会出现横向滚动条，
          # 最右边的操作列被推出可视区（按钮看起来"消失"了）。截图里那只是一条灰线，
          # 很难肉眼看出来，所以直接拿 ScrollViewer 的 ScrollableWidth 断。
          if ($log -notmatch 'columns-apps: viewport=\d+ total=\d+ hscroll=no') {
            $failures += "已安装应用表出现横向滚动条（列宽之和超过视口）"
          }
          # 操作列被星号列挤扁时，ActualWidth 会明显小于声明值。
          if ($log -notmatch '操作=274/2[6-9]\d') {
            $failures += "已安装应用的操作列被挤压，按钮会显示不全"
          }

          # 提权进程要接收资源管理器的拖放，必须先给窗口放行 UIPI 的三个拖放消息
          # （WM_DROPFILES / WM_COPYDATA / WM_COPYGLOBALDATA）。放行失败时用户看到的
          # 就是「拖进来毫无反应」，而且不抛任何异常、日志里也没有痕迹。
          # 返回 5（拒绝访问）说明当前进程被更强的沙箱压着，正常机器上必须是 0。
          if ($log -notmatch 'dragdrop: error=0 viewAllowDrop=True') {
            $failures += "窗口没有放行拖放消息（UIPI 过滤），拖入文件夹会没反应"
          }

          # 导航项数量：新增页面必须一起出现在侧栏里，否则页面写了也点不到。
          if ($log -notmatch 'nav: groups=\d+ items=24 ') {
            $failures += "侧栏导航不是 24 项（新增页面可能没注册到 MainViewModel）"
          }

          # 进程管理：枚举进程不需要管理员权限，拿不到就是真的坏了。
          if ($log -notmatch 'processes: count=[1-9]\d* self=True') {
            $failures += "进程管理没有枚举到进程，或者列表里没有 WinKit 自己"
          }

          # 还原点与 SMART 都要管理员才能读。CI 的冒烟进程是 asInvoker，
          # 读不到属正常，所以脚本里只要求「要么有数据，要么把原因说清楚」。
          if ($log -notmatch 'restore: .*result=OK') {
            $failures += "系统还原点页既没列出还原点，也没说明原因"
          }
          if ($log -notmatch 'smart: .*result=OK') {
            $failures += "SMART 属性页既没读到属性，也没说明原因"
          }

          # 浏览页面与正常运行走同一条非模态导航路径，不再为自检关闭提权弹窗。
          if ($log -notmatch 'elevation: elevated=\w+ banner=\w+ navigation=nonmodal') {
            $failures += "没有打印非模态导航权限状态"
          }
          if ($log -notmatch 'ux-interactions: .*result=OK') {
            $failures += "导航、权限说明或可撤销反馈的交互回归检查失败"
          }
          foreach ($check in @('ux-backup', 'ux-path', 'ux-diff', 'ux-close', 'ux-update', 'ux-uninstall', 'ux-motion', 'ux-motion-shell')) {
            if ($log -notmatch "${check}: .*result=OK") { $failures += "$check 交互回归缺失或失败" }
          }
          if ($log -notmatch 'ux-errors: pages=14 buttons=unobstructed result=OK') {
            $failures += "14页错误提示未全部通过遮挡检查"
          }
          if ($log -notmatch 'theme: .*visual=True result=OK') {
            $failures += "真实窗口的深浅主题切换失败"
          }

          if ($failures.Count -gt 0) {
            Write-Host "---- smoke.log ----"
            Get-Content $logPath | Write-Host
            throw ("界面自检失败：`n" + ($failures -join "`n"))
          }

          Write-Host "界面自检通过：$okCount 个模块 OK，关键模块数据齐备"

      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: |
            smoke-out/smoke.log
            smoke-out/*.png
            smoke.stdout.txt
            smoke.stderr.txt
          if-no-files-found: warn

      - name: Prepare verified EXE and update metadata
        shell: pwsh
        run: |
          # 发布通过上述原生 smoke 的同一个单 EXE，不再二次 publish。
          $assetPath = Join-Path $PWD $env:RELEASE_EXE
          Copy-Item -LiteralPath publish/preview/WinKit.exe -Destination $assetPath -Force
          $asset = Get-Item -LiteralPath $assetPath
          $metadata = [ordered]@{
            schemaVersion = 1
            version = $env:RELEASE_VERSION
            rid = "win-x64"
            fileName = $asset.Name
            sha256 = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
            size = [long]$asset.Length
          }
          $metadataPath = Join-Path $PWD $env:RELEASE_METADATA
          [System.IO.File]::WriteAllText($metadataPath, ($metadata | ConvertTo-Json), [System.Text.UTF8Encoding]::new($false))

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinKit-${{ env.PACKAGE_REF }}
          path: |
            ${{ env.RELEASE_EXE }}
            ${{ env.RELEASE_METADATA }}
          if-no-files-found: error

      - name: Build and verify optional release EXEs
        if: startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 10
        shell: pwsh
        run: ./build-variants.ps1

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ### ${{ env.RELEASE_VERSION }} 操作体验与清理保护

            - **查找工具**：在侧栏按名称或用途搜索，不用先猜模块在哪个分组。
            - **状态变化**：按下、选中、提示与切页使用统一的短过渡；滚动、拖拽和列宽仍直接跟手。支持 Windows 的减少动态效果。
            - **卸载残留**：匹配只提供线索，默认不勾选；安装目录的上级文件夹只供查看。整目录回收单独确认，不等同于卸载软件。
            - **系统清理与驱动**：只读清理扫描不阻止切换页面；永久清空回收站单独确认。驱动部分安装失败时保留未完成项，并明确是否需要重启。
            - **体检、维护与事件日志**：在页内显示当前进度、结果与下一步，不把 Windows 接受维护请求误报为完成。
            - **环境变量和 WinKit 更新**：新增用户变量时一次输入名称和值；PATH 草稿可返回检查，未处理前不重启更新。
            - **快速访问**：保存顺序前核对资源管理器现状；外部变更时不覆盖，部分失败会尝试恢复并报告结果。

            ### 运行要求与下载说明

            - **默认版**：`${{ env.RELEASE_EXE }}`，适用于 Windows 11 x64，已包含 .NET 运行时。仅此版本配套 `${{ env.RELEASE_METADATA }}`，供内置更新和手动校验使用。
            - **压缩自包含版**：`WinKit-v${{ env.RELEASE_VERSION }}-win-x64-compressed.exe`，下载更小，不用另装 .NET。
            - **不带运行时版**：`WinKit-v${{ env.RELEASE_VERSION }}-win-x64-framework-dependent.exe`，需要已安装 .NET 10 桌面运行时（Windows x64）。
            - 内置更新仍下载默认版；若希望一直使用备用版，请手动下载对应文件。双击默认以普通权限启动，需要管理员时可点击「以管理员身份重新启动」。
            - SmartScreen 提示受文件声誉、下载标记和本机策略影响。核实来源后，可在文件属性提供该选项时「解除锁定」；不保证解除标记后不再出现安全提示。详见 README。
            - 仓库配置 Probe 服务层自测与界面离屏自检门禁；本次结果以对应 Actions 日志为准，用例数随版本变化。
          fail_on_unmatched_files: true
          files: |
            ${{ env.RELEASE_EXE }}
            ${{ env.RELEASE_METADATA }}
            dist/variants/WinKit-v${{ env.RELEASE_VERSION }}-win-x64-compressed.exe
            dist/variants/WinKit-v${{ env.RELEASE_VERSION }}-win-x64-framework-dependent.exe

  verify-public-update:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish isolated older-version probe
        shell: pwsh
        run: |
          dotnet publish tools/UpdateEndToEndProbe/UpdateEndToEndProbe.csproj -c Release -r win-x64 --self-contained true -o artifacts/update-e2e-probe --nologo -m:1
          if ($LASTEXITCODE -ne 0) { throw "Public-update probe publish failed" }

      - name: Verify the public release through the production updater
        id: public_update
        timeout-minutes: 10
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.release_version }}
        run: |
          & ./tools/UpdateEndToEndProbe/Run-UpdateEndToEnd.ps1 -PublishedProbe "$PWD/artifacts/update-e2e-probe/WinKit.exe" -ExpectedVersion $env:EXPECTED_VERSION
          if (-not $?) { throw "Public-update end-to-end acceptance failed" }

      - name: Upload public-update acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-update-evidence
          path: |
            ${{ steps.public_update.outputs.artifact_directory }}/*.json
          if-no-files-found: warn
