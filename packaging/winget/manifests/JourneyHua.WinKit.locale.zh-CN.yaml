ShortDescription: 一个不需要装一堆小工具的 Windows 系统管理面板
Description: >-
  WinKit 把日常维护 Windows 要用到的几十项操作集中到一个界面里：体检与维护、系统概览、
  磁盘健康与 SMART 原始属性、系统还原点、进程管理、环境变量、右键菜单与「此电脑」图标、
  导航栏与任务栏固定项、应用卸载与残留清理、驱动备份与更新、启动项与服务、系统清理、
  系统调优、文件占用解锁、文件对比、重复文件检测、默认打开方式、事件日志诊断、
  Windows 更新管理、网络诊断、注册表体检与快照备份还原。
  界面为中文，以普通权限启动；清理、服务、驱动、补丁、还原点等写入操作会在程序内提示提权。
