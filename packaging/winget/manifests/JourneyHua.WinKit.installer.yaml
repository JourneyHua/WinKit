# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

PackageIdentifier: JourneyHua.WinKit
PackageVersion: 1.10.2
InstallerLocale: zh-CN
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: WinKit.exe
    PortableCommandAlias: winkit
UpgradeBehavior: install
# 从 1.10.0 起 app 清单是 asInvoker（未签名 + 要提权会被 SmartScreen 拦），
# 安装本身只是解压，不需要提权；需要管理员的模块由程序内部按需提权。
# 所以这里显式声明「不要提权」，写 elevationRequired 会让 winget 白弹一次 UAC。
ElevationRequirement: elevationProhibited
ArchiveBinariesDependOnPath: true
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/JourneyHua/WinKit/releases/download/v1.10.2/WinKit-v1.10.2-framework-dependent.zip
    # 发版后必须用 update.ps1 换成真实哈希，占位值提交上去会被仓库校验打回
    InstallerSha256: 059BFC356C8CB915AF0ED4A790E1946E3BCFE21A43AE6E3A98AF000F85BB2BCE
# 这是 framework-dependent 包（不打包 .NET 运行时），装上运行时才跑得起来。
# 写进依赖，winget 会自己把它一起装掉。
# 注意字段层级：三份清单里只有 installer 有 Dependencies，而包依赖挂在
# Dependencies.PackageDependencies 下面；直接写根级 PackageDependencies 会被
# 校验器判为未知字段（winget validate 报 Unknown field: [PackageDependencies]）。
Dependencies:
  PackageDependencies:
  - PackageIdentifier: Microsoft.DotNet.DesktopRuntime.10
    MinimumVersion: 10.0.0
ManifestType: installer
ManifestVersion: 1.12.0
